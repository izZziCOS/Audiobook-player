name: Build and test

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flags: ""
          - os: macos-latest
            flags: "-race"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install a C compiler
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Put the C compiler on the path
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ${{ matrix.flags }} ./...

  windows-installer:
    name: Windows installer
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      SIGNING: ${{ vars.SIGNING_ENDPOINT != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install a C compiler
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Put the C compiler on the path
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin"

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = (Select-String -Path FyneApp.toml -Pattern 'Version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Versions must look like 1.2.3, not '$version'"
            exit 1
          }
          Add-Content $env:GITHUB_OUTPUT "version=$version"

      - name: Build the app
        run: go run fyne.io/tools/cmd/fyne@v1.7.3 package -os windows -release --app-version ${{ steps.version.outputs.version }} --app-build ${{ github.run_number }}

      - name: Sign the app
        if: env.SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\Audiobook Player.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build the installer
        shell: pwsh
        run: |
          $places = "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe"
          $compiler = Get-ChildItem $places -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $compiler) {
            choco install innosetup --no-progress -y
            $compiler = Get-ChildItem $places -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          & $compiler.FullName "/DAppVersion=${{ steps.version.outputs.version }}" packaging\windows\AudiobookPlayer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign the installer
        if: env.SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\AudiobookPlayerSetup-${{ steps.version.outputs.version }}.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - uses: actions/upload-artifact@v7
        with:
          name: AudiobookPlayerSetup-${{ steps.version.outputs.version }}
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
          generate_release_notes: true
